name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzar el despliegue manualmente desde la pestaña Actions.
  workflow_dispatch:

# Permisos mínimos que necesita el despliegue a Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan varios push seguidos, deja terminar el despliegue en curso
# y encola solo el último.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir el sitio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Se usa `npm install` y no `npm ci` a propósito.
      #
      # Tailwind (@tailwindcss/oxide-wasm32-wasi) y Astro (@img/sharp-wasm32,
      # @bruits/satteri-wasm32-wasi) declaran @emnapi/core y @emnapi/runtime
      # como peer dependencies de paquetes opcionales. npm no registra las peer
      # dependencies de un paquete opcional que no se instala en la plataforma
      # actual, así que un lock generado en Windows nunca las incluye y `npm ci`
      # aborta en el runner de Linux con «Missing: @emnapi/core from lock file».
      # No hay forma de generar desde Windows un lock que las contenga: ni
      # siquiera `npm install --package-lock-only --os=linux` las añade.
      #
      # `npm install` respeta igualmente las versiones del lock que sí están
      # registradas y solo resuelve las que faltan. Si algún día el lock se
      # genera en Linux, se puede volver a `npm ci`.
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Construir con Astro
        run: npm run build

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
